apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/GreatTyrion/try-argo-cd.git
    targetRevision: HEAD
    path: apps/hello/overlays/local
  destination:
    server: https://kubernetes.default.svc
    namespace: hello
  syncPolicy:
    automated:
      prune: true      # resources removed from Git are removed from the cluster
      selfHeal: true   # manual changes in the cluster are reverted to the Git state
    syncOptions:
      - CreateNamespace=true
